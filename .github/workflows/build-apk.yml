
name: Build Mi Asistente APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar aplicacion Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar Mi Asistente
        working-directory: MiAsistente
        run: |
          gradle --no-daemon assembleDebug

      - name: Comprobar APK generado
        run: |
          test -f MiAsistente/app/build/outputs/apk/debug/app-debug.apk

      - name: Subir APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: MiAsistente-Android-APK
          path: MiAsistente/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
